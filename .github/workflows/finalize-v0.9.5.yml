name: Finalize AstraTerra Casino v0.9.5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          expected='63698f379a4475dd751687d46793d83ec526c704ffdda69bcf61f9fe5afbe63d'
          urls=(
            'https://astraterra-release-direct-public-end0fl1fe.vercel.app/AstraTerra-Casino-0.9.5-release(3).zip'
            'https://astraterra-release-direct-public-end0fl1fe.vercel.app/AstraTerra-Casino-0.9.5-release.zip'
            'https://astraterra-release-direct-public-end0fl1fe.vercel.app/'
          )

          archive='/tmp/AstraTerra-Casino-0.9.5-release.zip'
          verified='false'
          for url in "${urls[@]}"; do
            echo "Trying $url"
            rm -f "$archive"
            if curl --fail --location --retry 4 --retry-delay 2 --output "$archive" "$url"; then
              actual="$(sha256sum "$archive" | awk '{print $1}')"
              size="$(wc -c < "$archive")"
              echo "Downloaded $size bytes; SHA-256: $actual"
              if [[ "$actual" == "$expected" ]]; then
                verified='true'
                break
              fi
            fi
          done

          if [[ "$verified" != 'true' ]]; then
            echo 'Direct transport did not produce the verified archive.' >&2
            exit 1
          fi

          echo "$expected  $archive" | sha256sum --check --strict
          unzip -t "$archive"

          rm -rf /tmp/astraterra-release /tmp/astraterra-sources
          mkdir -p /tmp/astraterra-release /tmp/astraterra-sources
          unzip -q "$archive" -d /tmp/astraterra-release

          JAR_FILE="$(find /tmp/astraterra-release -type f -name 'astraterra-casino-0.9.5+mc1.20.1.jar' -print -quit)"
          SOURCES_FILE="$(find /tmp/astraterra-release -type f -name 'astraterra-casino-0.9.5-sources.zip' -print -quit)"
          test -n "$JAR_FILE" && test -f "$JAR_FILE"
          test -n "$SOURCES_FILE" && test -f "$SOURCES_FILE"

          echo "16c126030a9e8dec5753574313234ae9349ca3c8c017a004d655c6c822471dd5  $JAR_FILE" | sha256sum --check --strict
          echo "d9e3a49612e18de93cfac1de7fa676b5638ca1313c10870c0a45e502ad9de985  $SOURCES_FILE" | sha256sum --check --strict
          unzip -t "$SOURCES_FILE"
          unzip -q "$SOURCES_FILE" -d /tmp/astraterra-sources

          FABRIC_MOD="$(find /tmp/astraterra-sources -type f -path '*/src/main/resources/fabric.mod.json' -print -quit)"
          test -n "$FABRIC_MOD" && test -f "$FABRIC_MOD"
          PROJECT_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$FABRIC_MOD")")")")"
          test -d "$PROJECT_ROOT/src"

          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"
          echo "SOURCES_FILE=$SOURCES_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Publish clean repository tree
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .release-parts src docs releases
          rm -f .github/workflows/finalize-v0.9.5.yml
          rm -f .github/workflows/verify-release-transport.yml
          rmdir .github/workflows .github 2>/dev/null || true

          mkdir -p docs/development docs/validation releases/v0.9.5
          cp -a "$PROJECT_ROOT/src" ./src

          README_DOC="$(find /tmp/astraterra-release -maxdepth 2 -type f -iname '*README*RU*.md' -print -quit || true)"
          CHANGELOG_DOC="$(find /tmp/astraterra-release -maxdepth 2 -type f -iname '*CHANGELOG*RU*.md' -print -quit || true)"
          ASSET_DOC="$(find /tmp/astraterra-release -maxdepth 2 -type f -iname '*ASSET*LICENSE*RU*.md' -print -quit || true)"
          WHEEL_DOC="$(find /tmp/astraterra-release -maxdepth 2 -type f -iname '*WHEEL*SPEC*RU*.md' -print -quit || true)"
          VALIDATION_DOC="$(find /tmp/astraterra-release -maxdepth 2 -type f -iname '*VALIDATION*' -print -quit || true)"

          [[ -z "$README_DOC" ]] || cp "$README_DOC" docs/README-0.9.5-RU.md
          [[ -z "$CHANGELOG_DOC" ]] || cp "$CHANGELOG_DOC" CHANGELOG.md
          [[ -z "$ASSET_DOC" ]] || cp "$ASSET_DOC" ASSET-LICENSES-RU.md
          [[ -z "$WHEEL_DOC" ]] || cp "$WHEEL_DOC" docs/development/WHEEL-SPEC-RU.md
          [[ -z "$VALIDATION_DOC" ]] || cp "$VALIDATION_DOC" docs/validation/VALIDATION-0.9.5-RU.txt

          cp "$JAR_FILE" releases/v0.9.5/astraterra-casino-0.9.5+mc1.20.1.jar
          cp "$SOURCES_FILE" releases/v0.9.5/astraterra-casino-0.9.5-sources.zip
          cp "$ARCHIVE" releases/v0.9.5/AstraTerra-Casino-0.9.5-release.zip

          cat > releases/v0.9.5/RELEASE-NOTES.md <<'EOF'
          # AstraTerra Casino 0.9.5 — Expedition Wheel

          Публичный релиз мода AstraTerra Casino для Minecraft 1.20.1 и Fabric.

          ## Файлы

          - `astraterra-casino-0.9.5+mc1.20.1.jar` — готовый мод для установки.
          - `astraterra-casino-0.9.5-sources.zip` — архив исходного кода.
          - `AstraTerra-Casino-0.9.5-release.zip` — полный комплект релиза с документацией и результатами проверки.
          - `SHA256SUMS.txt` — контрольные суммы файлов.

          ## Установка

          1. Установите Minecraft 1.20.1 и Fabric Loader.
          2. Установите зависимости, перечисленные в документации проекта.
          3. Скопируйте JAR-файл в папку `.minecraft/mods`.
          4. Запустите игру через профиль Fabric.

          ## Ограничение сборки

          В версии 0.9.5 отсутствует готовая конфигурация Gradle/Loom. Исходный код опубликован для аудита и дальнейшей разработки; официальный JAR проверен отдельно.
          EOF
          sed -i 's/^          //' releases/v0.9.5/RELEASE-NOTES.md

          cat > releases/v0.9.5/README.md <<'EOF'
          # Release v0.9.5

          Для обычной установки используйте `astraterra-casino-0.9.5+mc1.20.1.jar`.
          Архив исходников и полный ZIP предназначены для разработки, аудита и архивного хранения.
          EOF
          sed -i 's/^          //' releases/v0.9.5/README.md

          (
            cd releases/v0.9.5
            sha256sum \
              astraterra-casino-0.9.5+mc1.20.1.jar \
              astraterra-casino-0.9.5-sources.zip \
              AstraTerra-Casino-0.9.5-release.zip \
              > SHA256SUMS.txt
          )

          cat > README.md <<'EOF'
          # AstraTerra Casino

          Мод с механикой **Expedition Wheel** для Minecraft 1.20.1 на Fabric.

          ## Текущая версия

          **0.9.5**

          ## Скачать мод

          Откройте GitHub Releases, выберите релиз `v0.9.5` и скачайте:

          `astraterra-casino-0.9.5+mc1.20.1.jar`

          Поместите JAR-файл в папку `.minecraft/mods` и запустите Minecraft через Fabric Loader.

          ## Структура репозитория

          - `src/` — исходный код и ресурсы мода;
          - `docs/` — документация, спецификация и результаты проверки;
          - `releases/v0.9.5/` — копии релизных файлов и SHA-256;
          - `CHANGELOG.md` — история изменений;
          - `ASSET-LICENSES-RU.md` — лицензии ресурсов;
          - `BUILD-NOTES-RU.md` — сведения о сборке;
          - `LICENSE` — лицензия проекта.

          ## Сборка

          В версии 0.9.5 полноценная конфигурация Gradle/Loom не включена. Официальный готовый JAR публикуется в GitHub Releases.
          EOF
          sed -i 's/^          //' README.md

      - name: Commit published repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: publish AstraTerra Casino v0.9.5'
          git push origin HEAD:main

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --force v0.9.5
          git push origin v0.9.5 --force

          assets=(
            releases/v0.9.5/astraterra-casino-0.9.5+mc1.20.1.jar
            releases/v0.9.5/astraterra-casino-0.9.5-sources.zip
            releases/v0.9.5/AstraTerra-Casino-0.9.5-release.zip
            releases/v0.9.5/SHA256SUMS.txt
          )

          if gh release view v0.9.5 >/dev/null 2>&1; then
            gh release edit v0.9.5 \
              --title 'AstraTerra Casino 0.9.5 — Expedition Wheel' \
              --notes-file releases/v0.9.5/RELEASE-NOTES.md \
              --latest
            gh release upload v0.9.5 "${assets[@]}" --clobber
          else
            gh release create v0.9.5 "${assets[@]}" \
              --title 'AstraTerra Casino 0.9.5 — Expedition Wheel' \
              --notes-file releases/v0.9.5/RELEASE-NOTES.md \
              --latest
          fi
