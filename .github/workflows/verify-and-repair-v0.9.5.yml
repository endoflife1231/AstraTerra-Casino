name: Verify and repair AstraTerra Casino v0.9.5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository contents
        shell: bash
        run: |
          set -euo pipefail
          test -f src/main/resources/fabric.mod.json
          test -d src/main/java
          test ! -d .release-parts

          cd releases/v0.9.5
          echo '16c126030a9e8dec5753574313234ae9349ca3c8c017a004d655c6c822471dd5  astraterra-casino-0.9.5+mc1.20.1.jar' | sha256sum --check --strict
          echo 'd9e3a49612e18de93cfac1de7fa676b5638ca1313c10870c0a45e502ad9de985  astraterra-casino-0.9.5-sources.zip' | sha256sum --check --strict
          echo '63698f379a4475dd751687d46793d83ec526c704ffdda69bcf61f9fe5afbe63d  AstraTerra-Casino-0.9.5-release.zip' | sha256sum --check --strict
          unzip -t astraterra-casino-0.9.5+mc1.20.1.jar
          unzip -t astraterra-casino-0.9.5-sources.zip
          unzip -t AstraTerra-Casino-0.9.5-release.zip

      - name: Ensure tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --force v0.9.5
          git push origin v0.9.5 --force

          assets=(
            releases/v0.9.5/astraterra-casino-0.9.5+mc1.20.1.jar
            releases/v0.9.5/astraterra-casino-0.9.5-sources.zip
            releases/v0.9.5/AstraTerra-Casino-0.9.5-release.zip
            releases/v0.9.5/SHA256SUMS.txt
          )

          if gh release view v0.9.5 >/dev/null 2>&1; then
            gh release edit v0.9.5 \
              --title 'AstraTerra Casino 0.9.5 — Expedition Wheel' \
              --notes-file releases/v0.9.5/RELEASE-NOTES.md \
              --latest
            gh release upload v0.9.5 "${assets[@]}" --clobber
          else
            gh release create v0.9.5 "${assets[@]}" \
              --title 'AstraTerra Casino 0.9.5 — Expedition Wheel' \
              --notes-file releases/v0.9.5/RELEASE-NOTES.md \
              --latest
          fi

      - name: Download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/published-assets
          mkdir -p /tmp/published-assets
          gh release download v0.9.5 --dir /tmp/published-assets

          cd /tmp/published-assets
          echo '16c126030a9e8dec5753574313234ae9349ca3c8c017a004d655c6c822471dd5  astraterra-casino-0.9.5+mc1.20.1.jar' | sha256sum --check --strict
          echo 'd9e3a49612e18de93cfac1de7fa676b5638ca1313c10870c0a45e502ad9de985  astraterra-casino-0.9.5-sources.zip' | sha256sum --check --strict
          echo '63698f379a4475dd751687d46793d83ec526c704ffdda69bcf61f9fe5afbe63d  AstraTerra-Casino-0.9.5-release.zip' | sha256sum --check --strict
          unzip -t astraterra-casino-0.9.5+mc1.20.1.jar
          unzip -t astraterra-casino-0.9.5-sources.zip
          unzip -t AstraTerra-Casino-0.9.5-release.zip

      - name: Record successful verification and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          verified_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          cat > VERIFICATION-v0.9.5.md <<EOF
          # Verification — AstraTerra Casino v0.9.5

          Проверка завершена успешно: **${verified_at}**.

          Подтверждено:

          - исходный код находится в \`src/\`;
          - технический каталог \`.release-parts\` отсутствует;
          - тег \`v0.9.5\` опубликован;
          - GitHub Release опубликован;
          - все assets скачаны обратно с GitHub Releases;
          - JAR и оба ZIP-архива открываются без ошибок;
          - SHA-256 совпадают с эталонными значениями.

          ## SHA-256

          \`16c126030a9e8dec5753574313234ae9349ca3c8c017a004d655c6c822471dd5\` — \`astraterra-casino-0.9.5+mc1.20.1.jar\`

          \`d9e3a49612e18de93cfac1de7fa676b5638ca1313c10870c0a45e502ad9de985\` — \`astraterra-casino-0.9.5-sources.zip\`

          \`63698f379a4475dd751687d46793d83ec526c704ffdda69bcf61f9fe5afbe63d\` — \`AstraTerra-Casino-0.9.5-release.zip\`
          EOF
          sed -i 's/^          //' VERIFICATION-v0.9.5.md

          rm -f .github/workflows/verify-and-repair-v0.9.5.yml
          rmdir .github/workflows .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: record verified v0.9.5 publication'
          git push origin HEAD:main
